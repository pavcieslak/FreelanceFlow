services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectflow}
      POSTGRES_DB: ${POSTGRES_DB:-projectflow}
    # Not published to the host by default — only the app container reaches it.
    # Uncomment for local development against the database directly.
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectflow}:${POSTGRES_PASSWORD:-projectflow}@db:5432/${POSTGRES_DB:-projectflow}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CLOCKIFY_API_KEY: ${CLOCKIFY_API_KEY:-}
      CLOCKIFY_WORKSPACE_ID: ${CLOCKIFY_WORKSPACE_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Dumps the database on a schedule. The dumps land in ./backups on the host,
  # so they are visible and copyable without going through Docker — the volume
  # holding the database is otherwise the only copy of every invoice.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-projectflow}
      POSTGRES_DB: ${POSTGRES_DB:-projectflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-projectflow}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_POST_HOOK: ${BACKUP_POST_HOOK:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    # Takes one dump at startup, then every BACKUP_INTERVAL_SECONDS. A failed
    # dump is logged and the loop continues, so one bad night doesn't stop
    # every backup after it — check `docker compose logs backup` if you need to
    # know a dump ran.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /scripts/backup.sh || echo "[backup] dump failed, retrying next cycle" >&2
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  pgdata:
